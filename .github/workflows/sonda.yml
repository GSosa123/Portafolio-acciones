name: Sonda fuentes (temporal)
on:
  push:
    branches: [claude/project-thread-xm9gmn]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: CMF POST
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          u="https://www.cmfchile.cl/institucional/mercados/entidad.php?mercado=V&rut=96505760&grupo=&tipoentidad=RVEMI&row=&vig=VI&control=svs&pestania=25"
          curl -sL -m 40 -A "$UA" "$u" -o p.html
          python3 -c "import re;h=open('p.html',encoding='latin-1').read();i=h.find('name = \"form1\"');print(re.findall(r'<(?:input|select)[^>]*name=\"[^\"]+\"',h[i:i+20000]))"
          curl -sL -m 40 -A "$UA" -X POST "$u" --data "dd=###&mm=###&aa=###&dd2=###&mm2=###&aa2=###&dias=90" -o q.html -w "%{http_code} %{size_download}\n"
          python3 - <<'PY'
          import re
          h=open('q.html',encoding='latin-1').read()
          i=h.find('Por los documentos')
          j=h.find('<table', i)
          print('table idx', j)
          print(h[j:j+5000] if j>0 else h[i:i+3000])
          PY
