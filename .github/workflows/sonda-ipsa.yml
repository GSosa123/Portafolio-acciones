name: Sonda IPSA (temporal)
on:
  push:
    branches: [claude/project-thread-nz9ey4]
    paths: [.github/workflows/sonda-ipsa.yml]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in ipsa/2026 ipsa/2025 ipsa/09-02-2026 ipsa/2026-02-09; do curl -s -m 30 -A "Mozilla/5.0" https://findic.cl/api/$u -o o.json; echo "== $u"; python3 -c "
          import json;d=json.load(open('o.json'));s=d.get('serie',[]);m={x['fecha'][:10]:x['valor'] for x in s};print(len(s), s[:1], s[-1:]);[print(f,m.get(f)) for f in ['2025-12-30','2026-01-02','2026-02-09','2026-02-10','2026-02-12','2026-06-19','2026-11-04']]" || head -c 200 o.json; done
