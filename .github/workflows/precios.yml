name: Actualizar precios

on:
  schedule:
    # Lun–Vie cada 30 min, 12:00–20:59 UTC (cubre la rueda de la Bolsa de Santiago en horario de verano e invierno)
    - cron: "*/30 12-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/precios.py
      - name: Commit si hay cambios
        run: |
          if [ -n "$(git status --porcelain precios.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add precios.json
            git commit -m "Precios $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
