name: Dólar, UF y monedas

on:
  schedule:
    # Lun–Vie cada 30 min de ~8:00 a ~19:00 de Chile (mercado de divisas abierto)
    - cron: "5,35 11-22 * * 1-5"
    # Todos los días cada 3 h (la UF cambia cada día, también fines de semana)
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indicadores
  cancel-in-progress: false

jobs:
  indicadores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/indicadores.py
      - name: Commit si hay cambios
        run: |
          if [ -n "$(git status --porcelain indicadores.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add indicadores.json
            git commit -m "Indicadores $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q || true
            git push
          fi
